akka.javasdk.dev-mode.http-port = 9084

karakeep {
  tagging {
    # One attempt plus three retries, which is what karakeep's own tagging queue allows.
    max-attempts = 4
  }
  inference {
    base-url = "http://127.0.0.1:11434/v1"
    base-url = ${?KARAKEEP_INFERENCE_BASE_URL}
    model = "gpt-4o-mini"
    model = ${?KARAKEEP_INFERENCE_MODEL}
    timeout = 30s
  }
}
